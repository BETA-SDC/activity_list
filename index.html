<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16794a">
  <title>西湖大学β书院活动中心</title>
  <style>
    :root {
      font-size: 100%;
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-soft: #f5f9f6;
      --ink: #211d18;
      --muted: #756e63;
      --line: #e3e8e5;
      --green: #71c50a;
      --green-dark: #3b6705;
      --green-soft: #71c50a;
      --green-mid: #5a9e08;
      --red: var(--green);
      --red-dark: var(--green-dark);
      --red-soft: var(--green-soft);
      --blue: #7197e7;
      --blue-dark: #587bdb;
      --blue-soft: #e1ebff;
      --amber: #a86a16;
      --shadow: 0 0.5rem 1.5rem rgba(44, 31, 25, 0.08);
      --shadow-soft: 0 0.25rem 0.875rem rgba(44, 31, 25, 0.06);
      --radius: 1.25rem;
      --radius-sm: 0.875rem;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .page {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    .content {
      width: min(100% - 2rem, 72rem);
      margin: 0 auto;
      padding: 1.5rem 0 3.5rem;
      flex: 1;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 0.0625rem solid rgba(229, 221, 208, 0.9);
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(0.875rem);
      backdrop-filter: blur(0.875rem);
    }

    .header-inner {
      display: flex;
      width: min(100% - 2rem, 72rem);
      margin: 0 auto;
      flex-direction: column;
      gap: 0.875rem;
      padding: 0.875rem 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-mark {
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      place-items: center;
      border-radius: 0.875rem;
      color: #ffffff;
      background: linear-gradient(135deg, var(--green), #57b37a);
      box-shadow: 0 0.5rem 1rem rgba(22, 121, 74, 0.2);
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .brand-subtitle {
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .main-nav {
      display: flex;
      gap: 0.25rem;
      padding: 0.25rem;
      border: 0.0625rem solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
    }

    .main-nav a {
      flex: 1;
      padding: 0.625rem 0.5rem;
      border-radius: 0.75rem;
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .main-nav a.active {
      color: #ffffff;
      background: var(--red);
      box-shadow: 0 0.375rem 0.875rem rgba(22, 121, 74, 0.2);
    }

    .intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin: 1.5rem 0 1.25rem;
    }

    .eyebrow {
      margin: 0 0 0.35rem;
      color: var(--red);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .intro h1 {
      margin: 0;
      font-size: 2.1rem;
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    .intro .subtitle {
      max-width: 38rem;
      margin: 0.65rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .refresh-btn {
      flex: 0 0 auto;
      padding: 0.625rem 0.875rem;
      border: 0.0625rem solid var(--line);
      border-radius: 999rem;
      color: var(--red-dark);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 750;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .refresh-btn:hover {
      border-color: rgba(22, 121, 74, 0.35);
      background: #f8fcf9;
      transform: translateY(-0.0625rem);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .segmented {
      display: inline-flex;
      gap: 0.25rem;
      padding: 0.25rem;
      border: 0.0625rem solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
    }

    .segmented button {
      padding: 0.55rem 0.8rem;
      border: 0;
      border-radius: 0.75rem;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 750;
      transition: color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .segmented button.active {
      color: #ffffff;
      background: var(--red);
      box-shadow: 0 0.375rem 0.875rem rgba(22, 121, 74, 0.2);
    }

    .count-pill {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 1.5rem 0 0.75rem;
    }

    .group h2 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .group .group-count {
      display: inline-grid;
      min-width: 1.5rem;
      height: 1.5rem;
      place-items: center;
      padding: 0 0.4rem;
      border-radius: 999rem;
      color: var(--red-dark);
      background: var(--red-soft);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .activity-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.875rem;
    }

    .activity-card {
      position: relative;
      display: flex;
      overflow: hidden;
      flex-direction: column;
      gap: 0.7rem;
      padding: 1rem 1rem 1rem 1.25rem;
      border: 0.0625rem solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .activity-card::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0.25rem;
      content: "";
      background: linear-gradient(180deg, var(--green), #57b37a);
      opacity: 0.9;
    }

    .activity-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-0.125rem);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .code {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .badges {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 1.45rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999rem;
      font-size: 0.68rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.status {
      color: var(--red-dark);
      background: var(--red-soft);
    }

    .badge.type {
      color: var(--blue-dark);
      background: var(--blue-soft);
    }

    .activity-card h3 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .detail {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .task-details {
      display: grid;
      gap: 0.5rem;
      margin-top: 0.2rem;
      padding: 0.65rem;
      border: 0.0625rem solid var(--green-soft);
      border-radius: var(--radius-sm);
      background: var(--surface-soft);
    }

    .task-details-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      color: var(--green-dark);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .task-details-head span {
      display: inline-flex;
      min-height: 1.35rem;
      align-items: center;
      padding: 0 0.45rem;
      border-radius: 999rem;
      color: var(--green-dark);
      background: var(--green-soft);
      font-size: 0.68rem;
    }

    .task-list {
      display: grid;
      gap: 0.45rem;
    }

    .task-item {
      display: grid;
      gap: 0.2rem;
      padding: 0.5rem 0.6rem;
      border: 0.0625rem solid var(--line);
      border-radius: 0.65rem;
      background: var(--surface);
    }

    .task-work {
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 750;
      line-height: 1.35;
    }

    .task-owner,
    .task-time {
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1.35;
    }

    .task-details.empty {
      color: var(--muted);
      font-size: 0.76rem;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      margin: auto 0 0;
      padding-top: 0.65rem;
      border-top: 0.0625rem solid var(--line);
    }

    .meta div {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.82rem;
    }

    .meta dt {
      flex: 0 0 4rem;
      color: var(--muted);
      font-weight: 700;
    }

    .meta dd {
      margin: 0;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      border: 0.0625rem solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .stat-card span {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 750;
    }

    .stat-card strong {
      font-size: 1.7rem;
      line-height: 1;
    }

    .stat-card.red strong {
      color: var(--red);
    }

    .stat-card.blue strong {
      color: var(--blue);
    }

    .chart-card,
    .month-card {
      border: 0.0625rem solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .chart-card {
      padding: 1rem;
    }

    .chart-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .chart-head h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .legend {
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend i {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 0.2rem;
    }

    .legend i.red {
      background: var(--red);
    }

    .legend i.blue {
      background: var(--blue);
    }

    .chart-scroll {
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 0.75rem;
      min-width: max-content;
      height: 16rem;
      padding: 0.25rem 0.125rem 0;
    }

    .member-col {
      display: flex;
      width: 3rem;
      height: 100%;
      min-width: 3rem;
      align-items: center;
      flex-direction: column;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .bar {
      display: flex;
      width: 100%;
      max-width: 2.3rem;
      height: 11.5rem;
      overflow: hidden;
      flex-direction: column;
      justify-content: flex-end;
      border: 0.0625rem solid var(--line);
      border-radius: 0.65rem;
      background: var(--surface-soft);
    }

    .bar-segment {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      min-height: 0.3rem;
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 800;
    }

    .bar-segment.red {
      background: linear-gradient(180deg, #2c9a62, var(--green));
    }

    .bar-segment.blue {
      background: linear-gradient(180deg, #4f84f1, var(--blue));
    }

    .member-name {
      max-width: 3.75rem;
      color: var(--muted);
      text-align: center;
      word-break: break-all;
      font-size: 0.7rem;
      font-weight: 750;
      line-height: 1.2;
    }

    .month-card {
      margin-bottom: 1rem;
      padding: 1rem;
    }

    .month-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .month-head h2 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
    }

    .month-head span {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.3rem;
    }

    .calendar-weekday {
      padding: 0.2rem 0;
      color: var(--muted);
      text-align: center;
      font-size: 0.65rem;
      font-weight: 800;
    }

    .calendar-day {
      display: flex;
      min-height: 3.25rem;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0.25rem;
      border-radius: 0.6rem;
      background: var(--surface-soft);
    }

    .calendar-day.outside {
      visibility: hidden;
    }

    .day-number {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
    }

    .cal-event {
      overflow: hidden;
      padding: 0.12rem 0.22rem;
      border-radius: 0.4rem;
      color: var(--red-dark);
      background: var(--red-soft);
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.6rem;
      font-weight: 750;
      line-height: 1.2;
    }

    .cal-event .event-name {
      display: none;
    }

    .state-card {
      display: grid;
      min-height: 18rem;
      place-items: center;
      padding: 2rem;
      border: 0.0625rem solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      text-align: center;
    }

    .state-card p {
      max-width: 34rem;
      margin: 0.5rem auto 0;
      color: var(--muted);
    }

    .state-card h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .state-card .retry-btn {
      margin-top: 1rem;
      padding: 0.6rem 0.95rem;
      border: 0;
      border-radius: 999rem;
      color: #ffffff;
      background: var(--red);
      cursor: pointer;
      font-weight: 800;
    }

    .spinner {
      width: 2.25rem;
      height: 2.25rem;
      border: 0.25rem solid var(--red-soft);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .site-footer {
      padding: 1.5rem 1rem 2rem;
      color: var(--muted);
      text-align: center;
      font-size: 0.75rem;
    }

    .chart-scroll::-webkit-scrollbar {
      height: 0.5rem;
    }

    .chart-scroll::-webkit-scrollbar-thumb {
      border-radius: 999rem;
      background: #d5cbbb;
    }

    /* 768px */
    @media (min-width: 48rem) {
      .header-inner {
        align-items: center;
        flex-direction: row;
        justify-content: space-between;
      }

      .main-nav {
        width: auto;
      }

      .main-nav a {
        min-width: 7.5rem;
      }

      .intro {
        margin-top: 2rem;
      }

      .intro h1 {
        font-size: 2.75rem;
      }

      .activity-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stats-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .calendar-grid {
        gap: 0.4rem;
      }

      .calendar-day {
        min-height: 4.5rem;
        padding: 0.35rem;
      }

      .cal-event .event-name {
        display: inline;
      }
    }

    /* 1024px */
    @media (min-width: 64rem) {
      .intro h1 {
        font-size: 3.25rem;
      }

      .activity-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .chart-scroll {
        overflow-x: visible;
      }

      .bar-chart {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(4.25rem, 1fr));
        gap: 1rem;
        min-width: 0;
      }

      .member-col {
        width: auto;
        min-width: 0;
      }

      .calendar-day {
        min-height: 5.25rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/activities" aria-label="返回 Activities 页面">
          <div class="brand-mark">β</div>
          <div class="brand-copy">
            <div class="brand-title">西湖大学β书院活动中心</div>
            <div class="brand-subtitle">Activities · Calendar · Contribution</div>
          </div>
        </a>
        <nav class="main-nav" aria-label="主导航">
          <a href="#/activities" data-nav="activities">Activities</a>
          <a href="#/calendar" data-nav="calendar">Calendar</a>
          <a href="#/contribution" data-nav="contribution">Contribution</a>
        </nav>
      </div>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <footer class="site-footer">
      做大做强，再创辉煌
    </footer>
  </div>

  <script>
    (() => {
      "use strict";

      const app = document.getElementById("app");
      const VIEWS = ["activities", "calendar", "contribution"];
      const MAX_TASK_FILES = 200;

      const state = {
        activities: [],
        tasks: [],
        view: "activities",
        filterMode: "status"
      };

      const clean = (value) => (typeof value === "string" ? value.trim() : "");

      const toNumber = (value) => {
        const match = String(value || "").match(/\d+/);
        return match ? Number(match[0]) : 0;
      };

      const normalizeArray = (value) => (Array.isArray(value) ? value : [value]);

      const hasContent = (item) =>
        item && typeof item === "object" && !Array.isArray(item) && Object.keys(item).length > 0;

      const escapeHTML = (value) =>
        String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);

      const currentView = () => {
        const hash = location.hash.replace(/^#\/?/, "");
        return VIEWS.includes(hash) ? hash : "activities";
      };

      async function fetchJSON(path) {
        const url = `${path}?v=${Date.now()}`;
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`无法读取 ${path}（HTTP ${response.status}）`);
        }
        return response.json();
      }

      async function loadManifestPaths() {
        try {
          const manifest = await fetchJSON("./任务分工/index.json");
          if (Array.isArray(manifest)) {
            return manifest.map(String).filter(Boolean);
          }
          if (manifest && Array.isArray(manifest.files)) {
            return manifest.files.map(String).filter(Boolean);
          }
        } catch (error) {
          // 没有清单文件时使用自动探测。
        }
        return null;
      }

      async function loadTaskFiles() {
        const manifestPaths = await loadManifestPaths();

        if (manifestPaths && manifestPaths.length) {
          const settled = await Promise.allSettled(
            manifestPaths.map(async (name) => {
              const path = name.startsWith("./")
                ? name
                : `./任务分工/${name}`;
              const data = await fetchJSON(path);
              return normalizeArray(data).filter(hasContent);
            })
          );

          return settled
            .filter((result) => result.status === "fulfilled")
            .flatMap((result) => result.value);
        }

        const tasks = [];
        let consecutiveMisses = 0;

        for (let i = 1; i <= MAX_TASK_FILES; i += 1) {
          const path = `./任务分工/任务分工-P${i}.json`;
          try {
            const data = await fetchJSON(path);
            tasks.push(...normalizeArray(data).filter(hasContent));
            consecutiveMisses = 0;
          } catch (error) {
            consecutiveMisses += 1;
            if (consecutiveMisses >= 2) {
              break;
            }
          }
        }

        return tasks;
      }

      const sortActivities = (activities) =>
        [...activities].sort((a, b) => {
          const aNum = toNumber(a["代号"]);
          const bNum = toNumber(b["代号"]);
          if (aNum !== bNum) {
            return aNum - bNum;
          }
          return String(a["活动名称"] || "").localeCompare(
            String(b["活动名称"] || ""),
            "zh-CN",
            { numeric: true }
          );
        });

      const activityTimeText = (activity) => {
        const month = clean(activity["预计月份(Y)"]);
        const day = clean(activity["预计日期(D)"]);
        const hour = clean(activity["开始时间(H)"]);

        if (month && day) {
          return `${month}月${day}日${hour ? ` ${hour}` : ""}`;
        }
        if (month) {
          return `${month}月${hour ? ` ${hour}` : ""}`;
        }
        if (day) {
          return `${day}日${hour ? ` ${hour}` : ""}`;
        }
        return "日期待定";
      };

      const pageMeta = {
        activities: {
          title: "Activities",
        },
        calendar: {
          title: "Calendar",
          subtitle: "仅展示已填写预计日期（D）的活动。"
        },
        contribution: {
          title: "Contribution",
          subtitle: "统计每位成员的总负责人次数与分工负责人次数。"
        }
      };

      const pageIntro = (view) => {
        const meta = pageMeta[view];
        return `
          <section class="intro">
            <div>
              <p class="eyebrow">Westlake Beta College Activity Center</p>
              <h1>${escapeHTML(meta.title)}</h1>
              <p class="subtitle">${escapeHTML(meta.subtitle)}</p>
            </div>
            <button class="refresh-btn" id="refreshBtn" type="button">刷新数据</button>
          </section>
        `;
      };

      const emptyState = (message) => `
        <div class="state-card">
          <div>
            <h2>暂时没有可显示的内容</h2>
            <p>${escapeHTML(message)}</p>
          </div>
        </div>
      `;

      const taskTimeText = (task) => {
        const start = clean(task["预计开始时间"]);
        const end = clean(task["预计结束时间"]);

        if (start && end) {
          return `${start} — ${end}`;
        }
        if (start) {
          return `${start} 起`;
        }
        if (end) {
          return `截止 ${end}`;
        }
        return "";
      };

      const taskDetailsForActivity = (activity) => {
        const code = clean(activity["代号"]);
        const name = clean(activity["活动名称"]);
        let matches = state.tasks.filter((task) => clean(task["代号"]) === code);

        if (!matches.length && name) {
          matches = state.tasks.filter((task) => clean(task["活动名称"]) === name);
        }

        return matches.filter((task) =>
          clean(task["分工"]) || clean(task["负责人"]) || taskTimeText(task)
        );
      };

      const taskItem = (task) => {
        const work = clean(task["分工"]) || "未填写分工";
        const owner = clean(task["负责人"]) || "负责人待定";
        const time = taskTimeText(task);

        return `
          <div class="task-item">
            <div class="task-work">${escapeHTML(work)}</div>
            ${owner ? `<div class="task-owner">负责人：${escapeHTML(owner)}</div>` : ""}
            ${time ? `<div class="task-time">时间：${escapeHTML(time)}</div>` : ""}
          </div>
        `;
      };

      const activityCard = (activity) => {
        const code = clean(activity["代号"]) || "—";
        const name = clean(activity["活动名称"]) || "未命名活动";
        const status = clean(activity["状态"]) || "未分类";
        const type = clean(activity["活动类型"]) || "未分类";
        const owner = clean(activity["总负责人"]) || "待定";
        const location = clean(activity["地点"]);
        const detail = clean(activity["详情"]);
        const isAssigned = status === "已分工";
        const taskDetails = isAssigned ? taskDetailsForActivity(activity) : [];

        let taskDetailsHTML = "";
        if (isAssigned) {
          if (taskDetails.length) {
            taskDetailsHTML = `
              <div class="task-details">
                <div class="task-details-head">
                  分工细节
                  <span>${taskDetails.length} 项</span>
                </div>
                <div class="task-list">${taskDetails.map(taskItem).join("")}</div>
              </div>
            `;
          } else {
            taskDetailsHTML = `
              <div class="task-details empty">暂无分工明细</div>
            `;
          }
        }

        return `
          <article class="activity-card">
            <div class="card-top">
              <span class="code">${escapeHTML(code)}</span>
              <div class="badges">
                <span class="badge status">${escapeHTML(status)}</span>
                <span class="badge type">${escapeHTML(type)}</span>
              </div>
            </div>
            <h3>${escapeHTML(name)}</h3>
            ${detail ? `<p class="detail">${escapeHTML(detail)}</p>` : ""}
            ${taskDetailsHTML}
            <dl class="meta">
              <div>
                <dt>总负责人</dt>
                <dd>${escapeHTML(owner)}</dd>
              </div>
              <div>
                <dt>预计时间</dt>
                <dd>${escapeHTML(activityTimeText(activity))}</dd>
              </div>
              ${location ? `
                <div>
                  <dt>地点</dt>
                  <dd>${escapeHTML(location)}</dd>
                </div>
              ` : ""}
            </dl>
          </article>
        `;
      };

      const groupActivities = (activities, mode) => {
        const groups = new Map();
        for (const activity of sortActivities(activities)) {
          const key = mode === "type"
            ? clean(activity["活动类型"]) || "未分类"
            : clean(activity["状态"]) || "未分类";
          if (!groups.has(key)) {
            groups.set(key, []);
          }
          groups.get(key).push(activity);
        }
        return groups;
      };

      const renderActivities = () => {
        if (!state.activities.length) {
          return emptyState("请在根目录放置 活动表.json 后刷新。");
        }

        const groups = groupActivities(state.activities, state.filterMode);
        const groupsHTML = [...groups.entries()].map(([name, activities]) => `
          <section class="group">
            <h2>${escapeHTML(name)}</h2>
            <span class="group-count">${activities.length}</span>
          </section>
          <div class="activity-grid">
            ${activities.map(activityCard).join("")}
          </div>
        `).join("");

        return `
          <div class="toolbar">
            <div class="segmented" aria-label="分列方式">
              <button type="button" data-mode="status" class="${state.filterMode === "status" ? "active" : ""}">按状态分列</button>
              <button type="button" data-mode="type" class="${state.filterMode === "type" ? "active" : ""}">按活动类型分列</button>
            </div>
            <span class="count-pill">共 ${state.activities.length} 项活动</span>
          </div>
          ${groupsHTML}
        `;
      };

      const datedActivities = () =>
        sortActivities(
          state.activities.filter((activity) =>
            clean(activity["预计月份(Y)"]) && clean(activity["预计日期(D)"])
          )
        );

      const renderCalendar = () => {
        const dated = datedActivities();
        if (!dated.length) {
          return emptyState("当前没有填写预计日期（D）的活动。");
        }

        const months = new Map();
        for (const activity of dated) {
          const month = toNumber(activity["预计月份(Y)"]);
          if (!months.has(month)) {
            months.set(month, []);
          }
          months.get(month).push(activity);
        }

        const monthCards = [...months.entries()]
          .sort((a, b) => a[0] - b[0])
          .map(([month, activities]) => {
            const year = new Date().getFullYear();
            const daysInMonth = new Date(year, month, 0).getDate();
            const firstWeekday = new Date(year, month - 1, 1).getDay();
            const offset = (firstWeekday + 6) % 7;
            const byDay = new Map();

            for (const activity of activities) {
              const day = toNumber(activity["预计日期(D)"]);
              if (!byDay.has(day)) {
                byDay.set(day, []);
              }
              byDay.get(day).push(activity);
            }

            const cells = [];
            for (let i = 0; i < offset; i += 1) {
              cells.push('<div class="calendar-day outside" aria-hidden="true"></div>');
            }

            for (let day = 1; day <= daysInMonth; day += 1) {
              const events = byDay.get(day) || [];
              cells.push(`
                <div class="calendar-day">
                  <span class="day-number">${day}</span>
                  ${events.map((event) => `
                    <div class="cal-event" title="${escapeHTML(event["活动名称"] || "")}">
                      <span class="event-code">${escapeHTML(clean(event["代号"]) || "—")}</span>
                      <span class="event-name"> · ${escapeHTML(clean(event["活动名称"]))}</span>
                    </div>
                  `).join("")}
                </div>
              `);
            }

            return `
              <section class="month-card">
                <div class="month-head">
                  <h2>${month}月</h2>
                  <span>${activities.length} 项活动</span>
                </div>
                <div class="calendar-grid">
                  ${["一", "二", "三", "四", "五", "六", "日"].map((day) => `<div class="calendar-weekday">${day}</div>`).join("")}
                  ${cells.join("")}
                </div>
              </section>
            `;
          });

        return monthCards.join("");
      };

      const buildContribution = () => {
        const members = new Map();
        const ensure = (name) => {
          if (!members.has(name)) {
            members.set(name, { name, total: 0, task: 0 });
          }
          return members.get(name);
        };

        for (const activity of state.activities) {
          const owner = clean(activity["总负责人"]);
          if (owner) {
            ensure(owner).total += 1;
          }
        }

        for (const task of state.tasks) {
          const owner = clean(task["负责人"]);
          if (owner) {
            ensure(owner).task += 1;
          }
        }

        return [...members.values()]
          .filter((member) => member.total > 0 || member.task > 0)
          .sort((a, b) => {
            const diff = (b.total + b.task) - (a.total + a.task);
            if (diff !== 0) {
              return diff;
            }
            return a.name.localeCompare(b.name, "zh-CN", { numeric: true });
          });
      };

      const renderContribution = () => {
        const members = buildContribution();
        if (!members.length) {
          return emptyState("当前没有可统计的总负责人或分工负责人。");
        }

        const totalOwnerCount = members.reduce((sum, member) => sum + member.total, 0);
        const totalTaskCount = members.reduce((sum, member) => sum + member.task, 0);
        const maxCount = Math.max(
          1,
          ...members.map((member) => member.total + member.task)
        );

        const columns = members.map((member) => {
          const totalPercent = member.total / maxCount * 100;
          const taskPercent = member.task / maxCount * 100;
          const showTotalLabel = totalPercent >= 9;
          const showTaskLabel = taskPercent >= 9;

          return `
            <div class="member-col" title="${escapeHTML(member.name)}：总负责人 ${member.total} 次，分工负责人 ${member.task} 次">
              <div class="bar" role="img" aria-label="${escapeHTML(member.name)}：总负责人 ${member.total} 次，分工负责人 ${member.task} 次">
                ${member.task ? `<div class="bar-segment blue" style="height:${taskPercent}%">${showTaskLabel ? member.task : ""}</div>` : ""}
                ${member.total ? `<div class="bar-segment red" style="height:${totalPercent}%">${showTotalLabel ? member.total : ""}</div>` : ""}
              </div>
              <div class="member-name">${escapeHTML(member.name)}</div>
            </div>
          `;
        }).join("");

        return `
          <div class="stats-grid">
            <div class="stat-card red">
              <span>总负责人次数</span>
              <strong>${totalOwnerCount}</strong>
            </div>
            <div class="stat-card blue">
              <span>分工负责人次数</span>
              <strong>${totalTaskCount}</strong>
            </div>
            <div class="stat-card">
              <span>参与成员</span>
              <strong>${members.length}</strong>
            </div>
          </div>
          <section class="chart-card">
            <div class="chart-head">
              <h2>成员贡献堆叠图</h2>
              <div class="legend" aria-label="图例">
                <span><i class="red"></i>总负责人</span>
                <span><i class="blue"></i>分工负责人</span>
              </div>
            </div>
            <div class="chart-scroll">
              <div class="bar-chart">${columns}</div>
            </div>
          </section>
        `;
      };

      const updateNavigation = () => {
        document.querySelectorAll("[data-nav]").forEach((link) => {
          const active = link.dataset.nav === state.view;
          link.classList.toggle("active", active);
          if (active) {
            link.setAttribute("aria-current", "page");
          } else {
            link.removeAttribute("aria-current");
          }
        });
      };

      const render = () => {
        state.view = currentView();
        const body = state.view === "activities"
          ? renderActivities()
          : state.view === "calendar"
            ? renderCalendar()
            : renderContribution();

        app.innerHTML = pageIntro(state.view) + body;
        updateNavigation();
        document.title = `${pageMeta[state.view].title} · 西湖大学β书院活动中心`;
      };

      const showLoading = () => {
        app.innerHTML = `
          <div class="state-card">
            <div>
              <div class="spinner"></div>
              <p>正在读取活动与分工数据…</p>
            </div>
          </div>
        `;
      };

      const showError = (error) => {
        app.innerHTML = `
          <div class="state-card">
            <div>
              <h2>数据读取失败</h2>
              <p>${escapeHTML(error.message || "未知错误")}</p>
              <p>请将网站部署到 GitHub Pages，或使用本地静态服务器打开。直接双击 index.html 时，浏览器通常会阻止读取同目录 JSON 文件。</p>
              <button class="retry-btn" id="retryBtn" type="button">重试</button>
            </div>
          </div>
        `;
      };

      const loadData = async () => {
        const [activitiesData, tasks] = await Promise.all([
          fetchJSON("./活动表.json"),
          loadTaskFiles()
        ]);

        state.activities = normalizeArray(activitiesData).filter(hasContent);
        state.tasks = tasks;

        if (!state.activities.length) {
          throw new Error("活动表.json 中没有可用的活动数据。");
        }
      };

      const init = async () => {
        showLoading();
        try {
          await loadData();
          render();
        } catch (error) {
          showError(error);
        }
      };

      document.addEventListener("click", (event) => {
        const refreshButton = event.target.closest("#refreshBtn");
        if (refreshButton) {
          init();
          return;
        }

        const retryButton = event.target.closest("#retryBtn");
        if (retryButton) {
          init();
          return;
        }

        const modeButton = event.target.closest("[data-mode]");
        if (modeButton) {
          state.filterMode = modeButton.dataset.mode;
          render();
        }
      });

      window.addEventListener("hashchange", render);
      init();
    })();
  </script>
</body>
</html>
